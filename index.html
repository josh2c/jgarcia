<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Josh Garcia</title>
    <meta name="description" content="Technology, design and marketing. Building Trezure, Busy Cab and Bemore Labz.">
    <meta property="og:title" content="Josh Garcia">
    <meta property="og:description" content="Technology, design and marketing.">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="board.css">
    <link rel="stylesheet" href="desktop.css">
    <link rel="stylesheet" href="windows.css">
    <link rel="stylesheet" href="minigames.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&family=Anton&family=Caveat:wght@600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
</head>
<body class="jg board-page desktop-page is-desktop">

    <!-- One menubar across the top, present in both layers. -->
    <nav class="menubar">
        <a class="mb-mark" href="#" data-leave-board>Josh Garcia</a>
        <div class="mb-nav">
            <a href="#" id="mb-desktop" class="is-current" data-leave-board>Desktop</a>
            <a href="#" id="mb-board" data-enter-board>Board</a>
        </div>
        <div class="mb-right">
            <button type="button" id="mb-paintball" class="mb-tool" aria-pressed="false"
                    title="Shoot the page. Esc to stop.">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
                Paintball
            </button>
            <div class="mb-view" role="group" aria-label="Board view">
                <button type="button" class="bv-btn is-current" data-view="iso">Iso</button>
                <button type="button" class="bv-btn" data-view="flat">Flat</button>
            </div>
        </div>
    </nav>

    <!-- The board is the ground. The desktop is furniture standing on it. -->
    <div class="board-viewport" id="viewport">
        <div class="board-surface" id="surface"></div>
    </div>

    <!-- ---------- desktop layer ---------- -->
    <div class="dt-layer" id="desktop">

        <main class="dt-surface">
            <!-- Every icon lives in one layer so any of them can be dragged
                 anywhere, the way a real desktop works. -->
            <div class="dt-icons" id="icons"></div>


            <aside class="dt-widgets">
                <div class="dt-widget dt-clock dt-drag" data-id="widget:clock">
                    <div class="dt-time" id="clock-time">—</div>
                    <div class="dt-date" id="clock-date">—</div>
                    <hr class="dt-rule">
                    <div class="dt-status">Currently building</div>
                    <div class="dt-status-sub">Trezure &middot; Busy Cab &middot; Bemore Labz</div>
                </div>

                <div class="dt-widget dt-pad dt-drag" data-id="widget:readme" data-handle=".dt-pad-bar">
                    <span class="dt-pad-bar">
                        <span class="dt-pad-name"><span id="pad-dirty"></span>readme.txt &mdash; Notepad</span>
                        <span class="dt-pad-win" aria-hidden="true">&minus; &square; &times;</span>
                    </span>
                    <span class="dt-pad-menu" aria-hidden="true">File  Edit  View</span>
                    <textarea class="dt-pad-text" id="pad-text" spellcheck="false"
                              aria-label="readme.txt, editable">Hi — I'm Josh.

I build things end to end: the product, the
look, and the way it gets talked about.

Right now that means Trezure, a daily fantasy
sports app, plus Busy Cab and Bemore Labz. I
design and build websites for other people too.

Away from that: data, crypto, real estate,
strategy games, and a hundred-odd Python
problems solved for fun. I like systems you can
take apart.

Have a look around. The folders are real, the
board is a moodboard, and the games are ported
from an app I wrote in Flutter.

— Josh

(go on, type in it. it's a notepad.)</textarea>
                    <span class="dt-pad-status">
                        <span id="pad-pos">Ln 1, Col 1</span><span>UTF-8</span></span>
                </div>
            </aside>

            <footer class="dt-foot">
                <div class="dt-mark" aria-hidden="true"></div>
                <p class="dt-foot-line">Technology, Design &amp; Marketing</p>
                <p class="dt-foot-sub">Josh Garcia</p>
            </footer>
        </main>
    </div>

    <!-- ---------- board layer ---------- -->

    <p class="board-hint" id="hint">Drag to explore · click a card</p>



    <!-- shown only while the marker is armed -->
    <div class="pb-exit">
        <span>Click to fire · hold to rush</span>
        <button type="button" id="pb-clear">Clear</button>
        <button type="button" id="pb-stop">Esc</button>
    </div>

    <script src="windows.js"></script>
    <script src="reader.js"></script>
    <script src="games.js"></script>
    <script src="minigames.js"></script>
    <script type="module" src="board.js"></script>
    <script src="paintball.js"></script>
    <script src="desktop.js"></script>
</body>
</html>
