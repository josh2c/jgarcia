<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Josh Garcia</title>
    <meta name="description" content="Technology, design and marketing. Building Trezure, Busy Cab and Bemore Labz.">
    <meta property="og:title" content="Josh Garcia">
    <meta property="og:description" content="Technology, design and marketing.">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="board.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="jg board-page is-intro">

    <!-- One board throughout. The intro is the same plane seen flat. -->
    <div class="board-viewport" id="viewport">
        <div class="board-surface" id="surface"></div>
    </div>

    <div class="intro" id="intro">
        <div class="sp-frame">
            <div class="sp-frame-inner">
                <div class="sp-screen">
                    <span class="sp-mark">JG</span>
                    <i class="sp-chip" style="--x: 16%; --y: 20%; background: var(--jg-accent);"></i>
                    <i class="sp-chip" style="--x: 33%; --y: 62%; background: var(--jg-yellow);"></i>
                    <i class="sp-chip" style="--x: 64%; --y: 26%; background: var(--jg-green);"></i>
                    <i class="sp-chip" style="--x: 79%; --y: 64%; background: var(--jg-brown);"></i>
                </div>
            </div>
        </div>

        <div class="intro-foot">
            <div>
                <h1 class="intro-name">Josh<br>Garcia</h1>
                <p class="intro-sub">Technology,<br>Design &amp; Marketing</p>
            </div>
            <div class="intro-enter">
                <button type="button" class="jg-btn" id="enter">
                    <span>Enter</span>
                    <span class="jg-btn-arrow" aria-hidden="true">→</span>
                </button>
                <p class="intro-note">Drag to explore · click a card</p>
            </div>
        </div>
    </div>

    <aside class="jg-side board-side" id="rail">
        <a href="index.html" class="jg-logo">J<span class="a-r">G</span></a>
        <p class="jg-side-name">Josh Garcia<br>Technology,<br>Design &amp; Marketing</p>
        <nav class="jg-nav">
            <a href="index.html#board" class="is-current">Board</a>
            <a href="blog.html">Thoughts</a>
            <a href="desktop.html">Desktop</a>
            <a href="pitch.html">Pitch Deck</a>
        </nav>
        <div>
            <p class="jg-side-label">View</p>
            <div class="board-view" role="group" aria-label="Board view">
                <button type="button" class="bv-btn is-current" data-view="iso">Iso</button>
                <span class="bv-sep" aria-hidden="true">→</span>
                <button type="button" class="bv-btn" data-view="flat">Flat</button>
            </div>
        </div>
        <div class="jg-side-foot">
            <p class="jg-side-label">Elsewhere</p>
            <nav class="jg-nav">
                <a href="https://playtrezure.com" target="_blank" rel="noopener noreferrer">Trezure</a>
                <a href="https://busycabgame.com" target="_blank" rel="noopener noreferrer">Busy Cab</a>
                <a href="https://bemorelabz.com" target="_blank" rel="noopener noreferrer">Bemore Labz</a>
                <a href="https://x.com/0talentt" target="_blank" rel="noopener noreferrer">Twitter</a>
            </nav>
        </div>
    </aside>

    <p class="board-hint" id="hint">Drag to explore · click a card</p>

    <div class="dt-window" id="window" hidden>
        <div class="dt-window-bar">
            <span class="dt-window-title" id="window-title"></span>
            <button class="dt-window-close" id="window-close" aria-label="Close">✕</button>
        </div>
        <div class="dt-window-body" id="window-body"></div>
    </div>
    <div class="dt-scrim" id="scrim" hidden></div>

    <script src="games.js"></script>
    <script type="module" src="board.js"></script>
</body>
</html>
