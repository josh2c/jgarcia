<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Josh Garcia</title>
    <meta name="description" content="Technology, design and marketing. Building Trezure, Busy Cab and Bemore Labz.">
    <meta property="og:title" content="Josh Garcia">
    <meta property="og:description" content="Technology, design and marketing.">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="board.css">
    <link rel="stylesheet" href="desktop.css">
    <link rel="stylesheet" href="windows.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="jg board-page desktop-page is-desktop">

    <!-- One menubar across the top, present in both layers. -->
    <nav class="menubar">
        <a class="mb-mark" href="#" data-leave-board>Josh Garcia</a>
        <div class="mb-nav">
            <a href="#" id="mb-desktop" class="is-current" data-leave-board>Desktop</a>
            <a href="#" id="mb-board" data-enter-board>Board</a>
        </div>
        <div class="mb-right">
            <div class="mb-view" role="group" aria-label="Board view">
                <button type="button" class="bv-btn is-current" data-view="iso">Iso</button>
                <button type="button" class="bv-btn" data-view="flat">Flat</button>
            </div>
        </div>
    </nav>

    <!-- The board is the ground. The desktop is furniture standing on it. -->
    <div class="board-viewport" id="viewport">
        <div class="board-surface" id="surface"></div>
    </div>

    <!-- ---------- desktop layer ---------- -->
    <div class="dt-layer" id="desktop">

        <main class="dt-surface">
            <!-- Every icon lives in one layer so any of them can be dragged
                 anywhere, the way a real desktop works. -->
            <div class="dt-icons" id="icons"></div>


            <aside class="dt-widgets">
                <div class="dt-widget dt-clock">
                    <div class="dt-time" id="clock-time">—</div>
                    <div class="dt-date" id="clock-date">—</div>
                    <hr class="dt-rule">
                    <div class="dt-status">Currently building</div>
                    <div class="dt-status-sub">Trezure &middot; Busy Cab &middot; Bemore Labz</div>
                </div>

                <div class="dt-widget dt-panel">
                    <div class="dt-panel-bar"><span>Latest</span></div>
                    <a class="dt-panel-body" href="blog.html">
                        <span class="dt-panel-title">Reality’s Bend: Why Build What Doesn’t Exist Yet?</span>
                        <span class="dt-panel-meta">April 1, 2025 · Innovation</span>
                        <span class="dt-panel-cta">Open blog →</span>
                    </a>
                </div>
            </aside>

            <footer class="dt-foot">
                <div class="dt-mark" aria-hidden="true"></div>
                <p class="dt-foot-line">Technology, Design &amp; Marketing</p>
                <p class="dt-foot-sub">Josh Garcia</p>
            </footer>
        </main>
    </div>

    <!-- ---------- board layer ---------- -->

    <p class="board-hint" id="hint">Drag to explore · click a card</p>



    <!-- shown only while the marker is armed -->
    <div class="pb-exit">
        <span>Click to fire · hold to rush</span>
        <button type="button" id="pb-clear">Clear</button>
        <button type="button" id="pb-stop">Esc</button>
    </div>

    <script src="windows.js"></script>
    <script src="reader.js"></script>
    <script src="games.js"></script>
    <script type="module" src="board.js"></script>
    <script src="paintball.js"></script>
    <script src="desktop.js"></script>
</body>
</html>
